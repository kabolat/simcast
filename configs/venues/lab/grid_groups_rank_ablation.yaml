kind: composite
name: grid_groups_rank_ablation
venue: lab
bases:
  - id: mv_feeder 
    config: ../../bases/liander2024/mv_feeder.yaml
  - id: transformer
    config: ../../bases/liander2024/transformer.yaml
  - id: station_installation
    config: ../../bases/liander2024/station_installation.yaml
methods:
  - id: m0
    method: ../../methods/m0_independent.yaml
  - id: m2
    method: ../../methods/m2_conditional_low_rank.yaml
  - id: m3
    method: ../../methods/m3_set_aware_low_rank.yaml
  - id: m2_full_rank
    method: ../../methods/m2_conditional_low_rank.yaml
    overrides: {model: {latent_rank: 15}}
  - id: m3_full_rank
    method: ../../methods/m3_set_aware_low_rank.yaml
    overrides: {model: {latent_rank: 15}}
evaluations:
  - id: absolute_sum
    config: ../../evaluations/absolute_sum.yaml
    method_ids: [m0, m2, m3, m2_full_rank, m3_full_rank]
  - id: absolute_max
    config: ../../evaluations/absolute_max.yaml
    method_ids: [m0, m2, m3, m2_full_rank, m3_full_rank]
reports:
  - id: lab_main
    config: ../../reports/lab_main.yaml
    evaluation_ids: [absolute_sum, absolute_max]
