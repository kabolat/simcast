extends: protocol.yaml
kind: composite
name: static_sensitivity
bases:
  - {id: transformer, config: ../../bases/liander2024/transformer.yaml}
  - {id: solar_park, config: ../../bases/liander2024/solar_park.yaml}
  - {id: wind_park, config: ../../bases/liander2024/wind_park.yaml}
  - {id: mv_feeder, config: ../../bases/liander2024/mv_feeder.yaml}
  - {id: station_installation, config: ../../bases/liander2024/station_installation.yaml}
methods:
  - {id: m0, method: ../../methods/m0_independent.yaml}
  - {id: m1_lead_specific, method: ../../methods/m1_static_gaussian.yaml}
  - {id: m1_pooled, method: ../../methods/m1_static_gaussian.yaml, overrides: {model: {share_across_leads: true}}}
evaluations:
  - id: standard
    config: ../../evaluations/standard.yaml
