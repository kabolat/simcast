kind: evaluation
id: standard
metrics: [mean_pinball, crps, weighted_interval_score, energy_score, variogram_score, test_pseudo_nll]
sampling:
  num_samples: 4096
  evaluation_seed: 2027
  common_random_numbers: true
evaluation:
  quantile_levels: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
  interval_levels: [0.50, 0.80, 0.90]
  variogram_power: 0.5
  scenario_batch_size: 16
  joint_score_num_samples: 512
