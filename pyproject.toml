[project]
name = "simcast"
version = "0.1.0"
description = "Post-hoc cross-entity probabilistic dependence modelling for frozen time-series foundation models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "huggingface-hub>=0.34,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pyarrow>=17,<24",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "torch==2.12.1",
  "typer>=0.15,<1",
  "xarray>=2024.10,<2026",
  "zarr>=2.18,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simcast"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["simcast"]
strict = true
warn_unused_ignores = false
